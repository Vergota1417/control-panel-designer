name: Validate control panel designer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model tests and syntax validation
        run: npm run check
      - name: Install free browser-test tooling
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium browser for UI tests
        run: npx playwright install --with-deps chromium
      - name: Run interactive viewer smoke tests
        run: npx playwright test
      - name: Attach browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
